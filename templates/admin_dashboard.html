<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Welcome, Admin!</h1>
        <p>This is your admin dashboard.</p>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">User Management</h5>
                <p class="card-text">You can manage users here.</p>
                <a href="/user_management" class="btn btn-primary">Manage Users</a>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">System Overview</h5>
                <p class="card-text">View system statistics and logs here.</p>
                <a href="/system_overview" class="btn btn-primary">View Overview</a>
            </div>
        </div>
    </div>
</body>
</html>
